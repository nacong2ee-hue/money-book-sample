<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light">
<title>내 가계부</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#222;--sub:#777;--ac:#2f7d5b;--ac2:#e3f1ea;--rd:#d6453d;--ln:rgba(0,0,0,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-bg="mint"]{--bg:#e8f5ef;--ac:#2f8f6b;--ac2:#d3ece0}
:root[data-bg="lavender"]{--bg:#efeaf8;--ac:#6b55b8;--ac2:#e0d8f3}
:root[data-bg="peach"]{--bg:#fbece4;--ac:#d0643a;--ac2:#f7d9cb}
:root[data-bg="sky"]{--bg:#e6f1fa;--ac:#2f78b5;--ac2:#d0e4f4}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:76px}
h1{font-size:19px;margin:14px 16px 2px}.per{color:var(--sub);font-size:12.5px;margin:0 16px 10px}
.c{background:var(--card);border-radius:14px;margin:10px 12px;padding:14px;border:1px solid var(--ln)}
.c h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.r{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}.r:last-child{border:0}
.r small{color:var(--sub);display:block;font-size:12px}.n{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.big{font-size:22px;font-weight:700}.neg{color:var(--rd)}.pos{color:var(--ac)}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--ac)}.bar.o i{background:var(--rd)}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--ac2);color:var(--ac);margin-left:6px}.tag.s{background:#e8eefc;color:#3b5bb5}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--sub);padding:11px 0;font-size:12.5px}nav button.on{color:var(--ac);font-weight:700}
button,input,select{font:inherit;color:inherit}button.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px}
button.dng{background:none;color:var(--rd);border:1px solid var(--rd);border-radius:10px;padding:10px 14px}
.sh button:not(.pri):not(.dng){background:none;border:1px solid var(--ln);border-radius:10px;padding:10px 14px}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
.q{display:grid;grid-template-columns:1fr 2fr;gap:6px}.q .w{grid-column:1/3;display:flex;gap:6px}
#m{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}#m[hidden]{display:none}
.sh{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sh h3{margin:0 0 8px}.sh label{display:block;font-size:12.5px;color:var(--sub);margin:8px 0}.row{display:flex;gap:8px;margin-top:12px}
.add{display:block;margin:10px auto}.ms{text-align:center;color:var(--sub);padding:40px 20px}.tap{cursor:pointer}
.seg button{flex:1}.seg button:not(.pri){background:none;border:1px solid var(--ln);border-radius:10px;padding:9px}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head><body>
<h1>내 가계부</h1><div class="per" id="per"></div><div id="v"><div class="ms">불러오는 중…</div></div>
<nav id="nav"></nav><div id="m" hidden></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const sum=(a,f=x=>x.amt)=>a.reduce((t,x)=>t+(+f(x)||0),0);
let db=null,S={set:null,fixed:[],exp:[],sav:[],arc:[],incs:[],L:{}},tab='home',vw=null,qm='e';
const TABS=[['home','홈'],['fixed','고정비'],['exp','지출/수입'],['goal','목표'],['set','설정']];
const bar=p=>`<div class="bar ${p>=100?'o':''}"><i style="width:${Math.min(100,p)}%"></i></div>`;
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const HOL=()=>new Set((S.set.hol||'').split(/[,\s]+/).filter(Boolean));
function adj(y,m){const h=HOL(),d=new Date(y,m,S.set.payday);while(d.getDay()===0||d.getDay()===6||h.has(iso(d)))d.setDate(d.getDate()-1);return d}
function nat(ref){let y=ref.getFullYear(),m=ref.getMonth(),a=adj(y,m);if(iso(a)>iso(ref)){m--;a=adj(y,m)}const b=adj(y,m+1);b.setDate(b.getDate()-1);return{a:iso(a),b:iso(b)}}
function cyc(){const n=nat(new Date());return{a:S.set.cs&&S.set.csFor===n.a?S.set.cs:n.a,b:n.b}}
function dd(day){if(!day)return'';const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let t=new Date(t0.getFullYear(),t0.getMonth(),day);if(t<t0)t=new Date(t0.getFullYear(),t0.getMonth()+1,day);const d=Math.round((t-t0)/864e5);return d?'D-'+d:'오늘'}
function classify(t){const r=(S.set.rules||[]).find(r=>r.k&&t.includes(r.k));return r?r.c:'기타'}
function calc(){const s=S.set,A=vw&&S.arc.find(a=>a.id===vw),c=A?{a:A.a,b:A.b}:cyc(),ex=A?A.exp:S.exp.filter(e=>e.date>=c.a&&e.date<=c.b),FX=A?A.fixed:S.fixed,BU=A?A.budgets:s.budgets,INC=A?A.inc:s.inc,CARDS=A?A.cards:s.cards,IC=A?(A.incs||[]):S.incs.filter(e=>e.date>=c.a&&e.date<=c.b);
const fe=FX.filter(f=>f.type==='지출'),fs=FX.filter(f=>f.type==='저축');
const cats=BU.map(b=>{const u=sum(ex.filter(e=>e.cat===b.n));return{...b,u,r:b.a-u,p:b.a?u/b.a*100:0}});
const bud=sum(BU,b=>b.a),use=sum(ex),fixE=sum(fe),fixS=sum(fs);
const inc=IC.length?sum(IC):sum([INC.h,INC.s,INC.o],x=>x);
const saved=sum(S.sav),t=s.goal.t,rem=Math.max(0,t-saved),mo=s.goal.m?Math.ceil(rem/s.goal.m):0;
const dt=new Date();dt.setMonth(dt.getMonth()+mo);
return{c,ex,cur:cyc(),FX,INC,IC,cats,bud,use,fixE,fixS,inc,saved,t,rem,mo,eta:dt.getFullYear()+'년 '+(dt.getMonth()+1)+'월',
pre:sum(fe.filter(f=>f.day&&f.day<s.payday)),post:sum(fe.filter(f=>f.day&&f.day>=s.payday)),
cards:CARDS.map(k=>({...k,v:sum(ex.filter(e=>e.pay===k.m))+(+k.x||0)}))}}
function form(title,fields,vals,save,del){const m=$('#m');
m.innerHTML=`<div class="sh"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option ${o==vals[f.k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${f.k}" type="${f.t||'text'}" ${f.t==='number'?'inputmode="numeric"':''} value="${esc(vals[f.k]??'')}">`}</label>`).join('')}<div class="row"><button class="pri" id="ok">저장</button>${del?'<button class="dng" id="dl">삭제</button>':''}<button id="cx">취소</button></div></div>`;
m.hidden=false;const close=()=>{m.hidden=true};
$('#cx').onclick=close;m.onclick=e=>{if(e.target===m)close()};
$('#ok').onclick=async()=>{const v={};fields.forEach(f=>{let x=$('#f_'+f.k).value;v[f.k]=f.t==='number'?(x===''?null:+x):x});try{await save(v);close()}catch(e){alert('저장 실패: '+(e.message||e))}};
if(del)$('#dl').onclick=async()=>{if(confirm('삭제할까요?')){try{await del();close()}catch(e){alert('삭제 실패')}}}}
const saveSet=()=>db.doc('settings/main').set(S.set);
const clone=()=>JSON.parse(JSON.stringify(S.set));
function snap(c){const s=S.set;return JSON.parse(JSON.stringify({a:c.a,b:c.b,budgets:s.budgets,inc:s.inc,cards:s.cards,fixed:S.fixed.map(({id,...r})=>r),exp:S.exp.filter(e=>e.date>=c.a&&e.date<=c.b).map(({id,...r})=>r),incs:S.incs.filter(e=>e.date>=c.a&&e.date<=c.b).map(({id,...r})=>r),saved:sum(S.sav),ts:Date.now()}))}
const arch=c=>db.doc('archives/'+c.a).set(snap(c));
let busy=0;const did=new Set();
async function maintain(){const s=S.set;if(!s||busy||!['s','f','e','v','a'].every(x=>S.L[x]))return;busy=1;
try{const n=nat(new Date()),d=pd(n.a);d.setDate(d.getDate()-1);const p=nat(d);let pa=p.a;if(s.cs&&s.csFor===p.a)pa=s.cs;
if(!did.has(pa)&&!S.arc.some(a=>a.id===pa)&&S.exp.some(e=>e.date>=pa&&e.date<=p.b)){did.add(pa);await arch({a:pa,b:p.b})}
const G=s.goal;if(G.auto&&G.autoFrom&&G.m){const done=G.done||[],add=[];let c=n;for(let i=0;i<24&&c.a>=G.autoFrom;i++){if(!done.includes(c.a)&&!did.has('g'+c.a))add.push(c.a);const q=pd(c.a);q.setDate(q.getDate()-1);c=nat(q)}
if(add.length){add.forEach(a=>did.add('g'+a));for(const a of add)await db.doc('savings/auto-'+a).set({date:a,amt:G.m,memo:'자동 적립 (월급일)'});const t=clone();t.goal.done=[...(t.goal.done||[]),...add];await db.doc('settings/main').set(t)}}}catch(e){}busy=0}
const subs=[];
function render(){
document.documentElement.dataset.bg=(S.set&&S.set.bg)||'cream';
$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;render();scrollTo(0,0)}};
if(!user){$('#v').innerHTML='<div class="ms">로그인이 필요해요.<br><br><button class="pri" id="lg">로그인</button></div>';$('#lg').onclick=()=>login();return}
if(!S.set){$('#v').innerHTML='<div class="ms">데이터를 불러오는 중이에요…<br><br><small>처음 한 번, 데이터가 비어 있다면</small><br><button class="pri" id="sd">예시 데이터로 시작하기</button></div>';$('#sd').onclick=seed;return}
const k=calc();$('#per').innerHTML=`<select id="vs" style="width:auto;padding:4px 8px"><option value="">현재 ${k.cur.a} ~ ${k.cur.b}</option>${[...S.arc].sort((x,y)=>y.id.localeCompare(x.id)).map(a=>`<option value="${a.id}" ${vw===a.id?'selected':''}>저장됨 ${a.a} ~ ${a.b}</option>`).join('')}</select> 월급일 ${S.set.payday}일(휴일이면 앞당김)${vw?' <b style="color:var(--rd)">· 읽기 전용</b>':''}`;$('#vs').onchange=e=>{vw=e.target.value||null;render()};
$('#v').innerHTML=({home,fixed,exp,goal,set})[tab](k);if(vw){if(tab==='exp')$('#v .c').remove();document.querySelectorAll('#addF,#addS,#qo').forEach(e=>e.remove())}bind(k);maintain()}
const R=(a,b,cls='')=>`<div class="r"><span>${a}</span><span class="n ${cls}">${b}</span></div>`;
const BGS=[['cream','크림','#f6f5f1'],['mint','민트','#e8f5ef'],['lavender','라벤더','#efeaf8'],['peach','피치','#fbece4'],['sky','스카이','#e6f1fa']];
const cardUse=A=>sum((A.exp||[]).filter(e=>(A.cards||[]).some(c=>c.m===e.pay)))+sum(A.cards||[],c=>c.x);
const cbar=(v,g,u,a)=>{const m=a||u||g||1,w=x=>Math.min(100,x/m*100),col=u&&v>u?'var(--rd)':g&&v>g?'#e09a2f':'var(--ac)';return`<div class="bar" style="position:relative;overflow:visible"><i style="width:${w(v)}%;background:${col};border-radius:5px"></i>${[g,u].filter(Boolean).map(x=>`<b style="position:absolute;left:${w(x)}%;top:-3px;width:2px;height:14px;background:var(--tx);opacity:.4"></b>`).join('')}</div>`};
const cardRow=x=>{const lv=x.u&&x.v>x.u?['상한 초과','var(--rd)']:x.g&&x.v>x.g?['적정 초과','#e09a2f']:['적정 이내','var(--ac)'];return`<div style="padding:9px 0;border-bottom:1px solid var(--ln)"><div class="r" style="border:0;padding:0"><span>${esc(x.n)}<small>${x.d?'결제일 매월 '+x.d+'일 · '+dd(x.d):'결제일 미설정'}</small></span><span class="n">${won(x.v)}<small style="color:${lv[1]}">${lv[0]}</small></span></div>${cbar(x.v,x.g,x.u,x.a)}<small style="color:var(--sub);display:block;margin-top:6px">적정 ${won(x.g)} · 상한 ${won(x.u)} · 실제 한도 ${won(x.a)}${x.a?' · 잔여 '+won(x.a-x.v):''}</small></div>`};
function home(k){const left=k.bud-k.use,rest=k.inc-k.fixE-k.fixS-k.bud;return`
<div class="c" style="background:var(--ac2);border:0"><div style="font-size:12.5px;color:var(--sub)">이번 사이클 수입 · ${k.IC.length?'입력한 수입 합계':'기본값 (아직 입력 전)'}</div><div class="big">${won(k.inc)}원</div>${k.IC.length?`<small style="color:var(--sub)">${k.IC.map(e=>esc(e.name)+' '+won(e.amt)).join(' · ')}</small>`:''}</div>
<div class="c"><h2>이번 사이클 한눈에</h2>${R('고정 지출',won(k.fixE))}${R('고정 저축',won(k.fixS))}${R('월급일 전 · 후 출금 고정지출',won(k.pre)+' · '+won(k.post))}${R('남는 돈 (수입 − 고정 − 생활비 예산)',`<b>${won(rest)}</b>`,rest<0?'neg':'pos')}
<div style="margin-top:12px"><div class="r" style="border:0;padding:0"><span>생활비 예산 ${won(k.bud)}</span><span class="n">사용 ${won(k.use)}</span></div><div class="big ${left<0?'neg':'pos'}" style="margin:4px 0">${won(left)} <small style="font-size:13px;font-weight:400;display:inline;color:var(--sub)">남음 (${k.bud?Math.round(k.use/k.bud*100):0}% 사용)</small></div>${bar(k.bud?k.use/k.bud*100:0)}</div>
<div style="margin-top:14px">${k.cats.map(x=>`<div style="margin-bottom:10px"><div class="r" style="border:0;padding:0"><span>${esc(x.n)}</span><span class="n ${x.r<0?'neg':''}">${won(x.r)} 남음</span></div><small style="color:var(--sub)">${won(x.u)} / ${won(x.a)} · ${Math.round(x.p)}%</small>${bar(x.p)}</div>`).join('')}</div></div>
<div class="c"><h2>다음 달 신용카드 결제 대금 · 한도</h2>${k.cards.map(cardRow).join('')||'<div class="ms">설정에서 카드를 추가하세요</div>'}${k.cards.length>1?R('<b>합계</b>',`<b>${won(sum(k.cards,x=>x.v))}</b>`):''}</div>`}
const fx=(f)=>`<div class="r tap" data-f="${f.id}"><span>${esc(f.name)}<span class="tag ${f.type==='저축'?'s':''}">${f.type}</span><small>${f.day?'매월 '+f.day+'일':'출금일 미정'}</small></span><span class="n">${won(f.amt)}<small>${dd(f.day)}</small></span></div>`;
function fixed(k){const l=[...k.FX].sort((a,b)=>(a.day||99)-(b.day||99));return`<div class="c"><h2>고정비 · 출금일</h2>${l.map(fx).join('')||'<div class="ms">항목을 추가하세요</div>'}</div>
<div class="c">${R('지출 합계',won(k.fixE))}${R('저축 합계',won(k.fixS))}${R('<b>고정비 합계</b>',`<b>${won(k.fixE+k.fixS)}</b>`)}</div><button class="pri add" id="addF">+ 고정비 추가</button>`}
function exp(k){const l=[...k.ex].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));const pm=S.set.pay.split(',');return`
<div class="c"><h2>${qm==='i'?'수입 입력 (일자는 오늘, 나중에 수정 가능)':'지출 입력 (일자·카테고리는 자동)'}</h2><div class="row seg" style="margin:0 0 10px"><button id="mE" class="${qm==='e'?'pri':''}">지출</button><button id="mI" class="${qm==='i'?'pri':''}">수입</button></div><div class="q"><input id="qn" placeholder="${qm==='i'?'내용 (예: 월급)':'내용 (예: 로켓프레시 장보기)'}"><input id="qa" type="number" inputmode="numeric" placeholder="금액"><div class="w"><select id="qp">${pm.map(p=>`<option>${esc(p)}</option>`).join('')}</select><button class="pri" id="qo">추가</button></div></div></div>
<div class="c"><h2>공용 생활비 지출내역 · ${won(k.use)}원</h2>${l.map(e=>`<div class="r tap" data-e="${e.id}"><span>${esc(e.name)}<small>${e.date} · ${esc(e.cat)} · ${esc(e.pay||'')}</small></span><span class="n">${won(e.amt)}</span></div>`).join('')||'<div class="ms">이번 사이클 지출이 없어요</div>'}</div>
<div class="c"><h2>수입내역 · ${won(sum(k.IC))}원${k.IC.length?'':' (입력 전: 설정의 기본값 사용 중)'}</h2>${[...k.IC].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<div class="r tap" data-i="${e.id}"><span>${esc(e.name)}<small>${e.date} · ${esc(e.pay||'')}</small></span><span class="n pos">${won(e.amt)}</span></div>`).join('')||'<div class="ms">이번 사이클 수입을 입력하세요</div>'}</div>`}
